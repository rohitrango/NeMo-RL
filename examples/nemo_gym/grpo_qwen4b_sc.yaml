# Lightweight SingleController + NeMo-Gym GRPO config: Qwen3-4B, 32k sequences,
# one 8-GPU node. Derived from grpo_nanov3.yaml, with the Nemotron-specific
# MoE / Mamba / nano_v3-parser pieces removed because Qwen3-4B is dense.
#
# Launch with:
#   uv run examples/run_grpo_single_controller.py --config examples/nemo_gym/grpo_qwen4b_sc.yaml
#
# SingleController runs the rollout and train pumps concurrently over a
# TransferQueue DataPlane, so `data_plane.enabled: true` is mandatory and the
# `async_rl` block below (not `grpo.async_grpo`) controls staleness and
# backpressure. Validation and checkpointing are not implemented on this path
# yet, so both are off.
#
# GPU split on one node: 4 GPUs train (TP=PP=CP=1 -> DP=4), 4 GPUs generation.
grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 16
  val_num_generations_per_prompt: 4
  max_rollout_turns: 1 # for multi-turn rollouts. Math Environments just have 1 turn (answering the question)
  max_num_epochs: 1
  max_num_steps: 1000000
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 0  # SingleController does not support validation yet
  val_start_at: -1
  val_at_start: False
  val_at_end: False
  overlong_filtering: true
  advantage_clip_low: null
  advantage_clip_high: null
  max_val_samples: null
  # Early stop once this metric (e.g. accuracy or pass_k) reaches the threshold; null disables.
  stop_at_validation_metric: null
  # Required when stop_at_validation_metric is set.
  stop_at_validation_threshold: null
  val_batch_size: 256
  seed: 42
  skip_reference_policy_logprobs_calculation: true
  async_grpo:
    # Unused on the SingleController path: staleness lives in `async_rl` below.
    enabled: false # Set to true to enable async training mode
    # Max age (in training steps) for trajectories used in training
    max_trajectory_age_steps: 1
    in_flight_weight_updates: false
    recompute_kv_cache_after_weight_updates: false

  adv_estimator:
    name: "grpo"
    normalize_rewards: ${grpo.normalize_rewards}
    use_leave_one_out_baseline: ${grpo.use_leave_one_out_baseline}
    minus_baseline: true

  batch_multiplier: 1
  use_dynamic_sampling: False
  dynamic_sampling_max_gen_batches: 10
  reward_shaping:
    enabled: False
    overlong_buffer_length: 128
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
    stop_properly_penalty_coef: null
  reward_scaling:
    enabled: False
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0

  seq_logprob_error_threshold: 2
  # Advantage value assigned to invalid tool call tokens (e.g. -5.0 to penalize). null disables.
  invalid_tool_call_advantage: null
  # Advantage value assigned to tokens with malformed <think>/</think> tags (e.g. -5.0). null disables.
  malformed_thinking_advantage: null

loss_fn:
  disable_ppo_ratio: false
  reference_policy_kl_penalty: 0
  reference_policy_kl_type: k3
  use_kl_in_reward: false
  kl_input_clamp_value: null
  kl_output_clamp_value: null
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: null
  # (default off) loss formulation improvements (docs/guides/grpo.md#loss)
  use_on_policy_kl_approximation: True
  use_importance_sampling_correction: True
  sequence_level_importance_ratios: False
  token_level_loss: True
  truncated_importance_sampling_type: null
  truncated_importance_sampling_ratio: null
  truncated_importance_sampling_ratio_min: null
  force_on_policy_ratio: false
  use_cispo: false
  positive_example_nll_weight: 0.0

checkpointing:
  # SingleController does not save checkpoints yet (see the TODO in
  # nemo_rl/algorithms/single_controller.py).
  enabled: false
  checkpoint_dir: "results/grpo-qwen4b-single-controller"
  metric_name: "val:total_reward/mean"
  higher_is_better: true
  keep_top_k: 1000000
  save_period: 10
  checkpoint_must_save_by: "00:03:45:00"
  save_optimizer: true
  model_save_format: safetensors
  save_consolidated: false

policy:
  model_name: "Qwen/Qwen3-4B"
  tokenizer:
    name: ${policy.model_name} ## specify if you'd like to use a tokenizer different from the model's default
    chat_template_kwargs: null # kwargs for the chat template, e.g. enable_thinking=true
    use_fastokens: false
  hf_config_overrides: {}
  # SC requires npps * ngpp == train_global_batch_size (one RL step = one optimizer.step).
  train_global_batch_size: ${mul:${grpo.num_prompts_per_step}, ${grpo.num_generations_per_prompt}}
  train_micro_batch_size: 1
  generation_batch_size: ${grpo.num_generations_per_prompt} # Only used when generating using HF backend
  logprob_batch_size: 1
  max_total_sequence_length: 32768  # Qwen3-4B native context
  precision: "bfloat16"
  logprob_chunk_size: 2048

  dtensor_cfg:
    _v2: true
    enabled: false
    cpu_offload: False
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

  megatron_cfg:
    enabled: true
    force_reconvert_from_hf: False # Set to True to force reconvert of the model from Hugging Face
    checkpoint:
      async_save: true
      ckpt_assume_constant_structure: true
    empty_unused_memory_level: 1
    activation_checkpointing: true
    # Only takes effect when activation_checkpointing: true. "selective" recomputes
    # just recompute_modules (null -> ["core_attn"]); "full" recomputes everything.
    recompute_granularity: "full"
    recompute_modules: null
    bias_activation_fusion: False
    gradient_accumulation_fusion: false
    use_fused_weighted_squared_relu: false
    defer_fp32_logits: true
    # Qwen3-4B is dense and small: no model parallelism, all 4 training GPUs are DP.
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 1
    pipeline_dtype: ${policy.precision}
    sequence_parallel: false  # requires tensor_model_parallel_size > 1
    # Dense model: no experts. These keys are required by MegatronConfig, so they
    # stay at their inert values rather than being removed.
    freeze_moe_router: true
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    moe_router_dtype: "fp32"
    moe_router_load_balancing_type: "none" # "seq_aux_loss" causes logprob error divergence for grpo
    moe_router_bias_update_rate: 0.0
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: "alltoall"
    moe_per_layer_logging: false
    moe_shared_expert_overlap: false
    use_gloo_process_groups: false
    #gives ~20% training perf speedup with sequence packing
    apply_rope_fusion: True
    use_fused_linear_logprobs: false
    fused_linear_logprobs_chunk_size: 256
    mtp_num_layers: 0
    mtp_loss_scaling_factor: 0.0
    mtp_detach_heads: false
    mtp_use_repeated_layer: false

    fp8_cfg:
      enabled: false
      fp8: "e4m3"
      fp8_recipe: "blockwise"
      fp8_param: false

    peft:
      enabled: false
      target_modules: []
      exclude_modules: []
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: "post"
      lora_A_init_method: "xavier"
      lora_B_init_method: "zero"
      a2a_experimental: false
      lora_dtype: "None"

    optimizer:
      optimizer: "adam"
      lr: 3e-6
      min_lr: 3e-6
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: "float32"

      #adam
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8

      #sgd
      sgd_momentum: 0.9

      clip_grad: ${policy.max_grad_norm}

      #distributed optimizer
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true

      optimizer_cpu_offload: False
      optimizer_offload_fraction: 0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 3.0e-7

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      overlap_param_gather: true
      average_in_collective: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    env_vars: null

  draft:
    enabled: false
    model_name: null
    loss_weight: 0.1
    num_layers: null
    aux_layer_indices: null

  # See docs/design-docs/sequence-packing-and-dynamic-batching.md
  # for more details on dynamic batching and sequence packing.
  dynamic_batching:
    enabled: False
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: True
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    microbatch_order: "largest_first"
    sequence_length_round: 64

  # makes the training sequence length divisible by the tensor parallel size
  # this is useful for sequence parallel training
  make_sequence_length_divisible_by: ${mul:${mul:${policy.megatron_cfg.tensor_model_parallel_size}, ${policy.megatron_cfg.context_parallel_size}}, 2}
  max_grad_norm: 1.0

  optimizer: null # remove default FSDP optimizer
  scheduler: null

  offload_optimizer_for_logprob: False

  generation:
    # Port range for vLLM HTTP servers, kept below the OS ephemeral range.
    # See ray.sub for the full port layout.
    port_range_low: 3000
    port_range_high: 4999
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    val_temperature: ${.temperature}
    val_top_p: ${.top_p}
    val_top_k: ${.top_k}
    stop_token_ids: null
    stop_strings: null
    refit_transport: null
    real_quant_export_cpu_offload: true
    refit_cfg:
      nixl:
        update_weights_bucket_memory_ratio: 0.05
        device: cuda
        backend_name: UCX
        backend_init_params: null
        release_after_refit: false
        shard_expert_weights: false
    # Only read when backend == "megatron"; kept for parity with the reference
    # SingleController config so switching backends does not need new keys.
    mcore_generation_config:
      async_engine: false
      max_model_len: ${policy.max_total_sequence_length}
      cuda_graph_impl: local
      inference_cuda_graph_scope: block
      buffer_size_gb: 10
      num_cuda_graphs: 4
      block_size_tokens: 256
      use_cuda_graphs_for_non_decode_steps: true
      enable_chunked_prefill: true
      enable_prefix_caching: false
      max_tokens: ${policy.max_total_sequence_length}
      kv_cache_management_mode: persist
      materialize_only_last_token_logits: true
      num_speculative_tokens: 0
      refit_backend: nvshmem
      parsers: []
      expose_http_server: false
      unified_memory_level: 0
    vllm_cfg:
      async_engine: true
      use_tqdm: true
      # processed_logprobs matches the reference SC config; it decides which
      # logprobs vLLM returns for the importance ratio.
      logprobs_mode: processed_logprobs
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
      zmq_refit_server_port: null
      http_refit_server_port: null
      http_refit_api_key_env_var: null
      kv_cache_dtype: auto
      precision: ${policy.precision}
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1  # dense model, no experts
      gpu_memory_utilization: 0.8
      max_model_len: ${policy.max_total_sequence_length}
      # when enforce_eager is False, it is optional to set ++policy.generation.vllm_kwargs.compilation_config.backend=eager for better accuracy,
      # with the flag, vllm will use the custom CUDA kernels instead of the Triton kernels generated by torch.compile
      # for more details, see convergence issue https://github.com/NVIDIA-NeMo/RL/issues/998
      enforce_eager: False
      use_deep_gemm: False
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      expose_http_server: true
      # Qwen3 ships with vLLM's built-in parsers, so no reasoning_parser_plugin file.
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: hermes      # Qwen3's tool-call format
        reasoning_parser: qwen3  # built into vLLM; strips <think>...</think>

    vllm_kwargs:
      compilation_config:
        # when enforce_eager is False, set ++policy.generation.vllm_kwargs.compilation_config.backend=eager for better accuracy,
        # with the flag, vllm will use the custom CUDA kernels instead of the Triton kernels generated by torch.compile
        # for more details, see convergence issue https://github.com/NVIDIA-NeMo/RL/issues/998
        backend: eager
    colocated:
      # true: generation shares training GPUs
      # false: uses dedicated generation resources
      enabled: false
      # only relevant when enabled is false
      resources:
        gpus_per_node: 8 # Decides num gpus to be dedicated to generation when there is one node in the cluster i.e cluster.num_nodes == 1
        num_nodes: 1 # Decides number of nodes to be dedicated to generation

data:
  max_input_seq_length: null
  shuffle: False
  num_workers: 1
  use_multiple_dataloader: false

  train:
    data_path: "/data/nemorl-datasets/nanov3-blend/train-split.jsonl"
  # Must stay null on SingleController: setup_response_data loads this dataset
  # whenever it is set, regardless of val_period, and SC never validates.
  validation: null
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    prompt_file: null
    system_prompt_file: null
    processor: "nemo_gym_data_processor"

env:
  should_use_nemo_gym: true
  # true: skip expensive train_data_step*.jsonl; false: write full jsonl.
  should_log_nemo_gym_responses: true
  # false: ignore env mask_sample flags so the loss trains on every sample.
  should_mask_flagged_samples: true
  nemo_gym:
    # Port range for Gym HTTP servers, kept below the OS ephemeral range
    # (below the 9000 ephemeral floor on some GB200 nodes) and non-overlapping with NeMo
    # RL (3000-4999) or vLLM (7000-8999). See ray.sub for the full port layout.
    port_range_low: 5000
    port_range_high: 5999
    uv_venv_dir: /data/gym_venvs_sc-agent
    skip_venv_if_present: true
    # Run the agentic loop in the NemoGym actor instead of per-agent Gym servers.
    # See docs/design-docs/nemo-gym-integration.md#central-agent-loop-singlecontroller.
    # central_agent:
    #   enabled: true
    # The resources servers listed here must cover every agent_ref in the dataset
    # above; trimming this list means pointing `data.train` at a matching dataset.
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml  # Required! And it must be *for_training
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    - resources_servers/code_gen/configs/code_gen.yaml
    - resources_servers/workplace_assistant/configs/workplace_assistant.yaml
    - resources_servers/mcqa/configs/mcqa.yaml
    - resources_servers/instruction_following/configs/instruction_following.yaml
    - resources_servers/structured_outputs/configs/structured_outputs_json.yaml
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: policy_model
          should_use_judge: false
    code_gen:
      resources_servers:
        code_gen:
          num_processes: 128
          unit_test_timeout_secs: 10
          debug: false

logger:
  log_dir: "logs"  # Base directory for all logs
  num_val_samples_to_print: 0 # Number of validation samples to pretty print on terminal
  wandb_enabled: true
  tensorboard_enabled: false
  mlflow_enabled: false  # Disable MLflow logging
  monitor_gpus: true  # If true, will monitor GPU usage and log to wandb and/or tensorboard
  swanlab_enabled: false # Disable SwanLab logging
  wandb:
    project: "grpo-dev"
    name: "grpo-qwen4b-sc"
    log_nemo_gym_full_result_tables: false
  tensorboard: {}
  swanlab:
    project: "grpo-dev"
    name: "grpo-qwen4b-sc"
  mlflow:
    experiment_name: "grpo-dev"
    run_name: "grpo-qwen4b-sc"
    tracking_uri: "http://localhost:5000"
  gpu_monitoring:
    collection_interval: 10  # How often to collect GPU usage metrics (in seconds)
    flush_interval: 10  # How often to flush GPU usage metrics to the loggers (in seconds)

# TransferQueue DataPlane. Mandatory for the SingleController path — rollouts are
# committed here by the rollout pump and claimed by the train pump.
data_plane:
  enabled: true
  impl: transfer_queue
  backend: "simple"                  # TQ storage backend ('simple' or 'mooncake_cpu')
  storage_capacity: 1000000          # max samples retained per partition
  num_storage_units: 2               # storage shards
  claim_meta_poll_interval_s: 0.5    # blocking-claim poll cadence
  global_segment_size: 549755813888  # 512 GiB — used when backend == "mooncake_cpu"
  local_buffer_size:   68719476736   # 64 GiB  — used when backend == "mooncake_cpu"

async_rl:
  sampler:
    name: windowed
    # Max weight-version gap a group may have from the trainer when selected.
    max_staleness_versions: 1
  # Recompute generation KV caches after each weight update.
  recompute_kv_cache_after_weight_updates: false
  # The trainer dispatches once this many groups are ready: one full RL step.
  min_groups_for_streaming_train: ${grpo.num_prompts_per_step}
  # Cap on in-flight generate_and_push calls in the rollout pump.
  max_inflight_prompts: ${grpo.num_prompts_per_step}
  # Backpressure. Must stay above min_groups_for_streaming_train, and above
  # num_prompts_per_step * (lookahead + 1) if you switch to a gated sampler
  # (in_order / weight_fifo), or the rollout pump deadlocks on buffer slots.
  max_buffered_rollouts: 64
  # Per-rollout diagnostic prints (prompt content / completion previews).
  diagnostics: false

cluster:
  gpus_per_node: 8
  num_nodes: 2
  segment_size: null
  master_port_range_low: 1400
  master_port_range_high: 1999

# Reward penalties are read by the synchronous rollout path; inert on the
# SingleController path, kept for parity with the non-SC gym configs.
reward_penalties:
  penalize_duplicated_reasoning: false
  penalize_empty_final_answer: false
  penalize_unwanted_tokens: false
  penalize_malformed_think_tag: false
  token_ids: null

# Multi-Teacher On-Policy Distillation. null = disabled.
on_policy_distillation: null
