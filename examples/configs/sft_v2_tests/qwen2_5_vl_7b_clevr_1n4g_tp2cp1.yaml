defaults: nm4_clevr_4n.yaml

policy:
  model_name: /data/models/Qwen2.5-VL-7B-Instruct
  tokenizer:
    name: ${policy.model_name}
  megatron_cfg:
    tensor_model_parallel_size: 2
    context_parallel_size: 1
    expert_model_parallel_size: 1
    # The base config carries NM4-specific model settings.
    model_overrides: null
    mtp_num_layers: 0
    mtp_loss_scaling_factor: 0.0
    mtp_use_repeated_layer: false
    moe_router_load_balancing_type: none
    moe_aux_loss_coeff: 0.0
    recompute_granularity: full
    recompute_modules: null
    vision_recompute_num_layers: null
    use_fused_weighted_squared_relu: false

cluster:
  num_nodes: 1
  gpus_per_node: 4

checkpointing:
  pretrained_checkpoint: null
  checkpoint_dir: /data/nemorl-runs/qwen2.5-vl-7b-clevr-1n4g-tp2cp1

data:
  _override_: true
  backend: energon
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: true
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 0
  energon:
    num_workers: 2
    prefetch_factor: 2
    cache_pool_num_workers: 4
    gc_collect_every_n_steps: 100000
    model_family: qwen
    max_samples_per_sequence: 16
    processor_adapter: hf_multimodal
    topology_mapper: default
    task_encoder:
      name: generic_sft
      options: {}
      packing:
        name: balanced_greedy_knapsack
        buffer_size: 64
        options:
          max_sequence_length: ${policy.max_total_sequence_length}
          sequence_length_pad_multiple: 64
          balanced_knapsack_delta: 5
    cookers:
      - name: generic_conversation
        options: {}
  train:
    path: /data/nemorl-datasets/clevr
    split: train
    virtual_epoch_length: 4375
  validation: null

logger:
  log_dir: logs/qwen2.5-vl-7b-clevr-1n4g-tp2cp1
  wandb:
    name: qwen2.5-vl-7b-clevr-1n4g-tp2cp1
  tensorboard:
    log_dir: logs/qwen2.5-vl-7b-clevr-1n4g-tp2cp1
