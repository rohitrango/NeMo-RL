defaults:
  - sft_vlm_3B_energon.yaml

sft:
  max_num_steps: 100
  val_period: 0
  val_at_start: false
  val_at_end: false

policy:
  model_name: /data/models/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
  train_global_batch_size: 16
  train_micro_batch_size: 1
  max_total_sequence_length: 1024
  megatron_cfg:
    env_vars:
      HF_MODULES_CACHE: /root/.cache/huggingface/modules
      PYTHONPATH: /root/.cache/huggingface/modules
    empty_unused_memory_level: 2
    activation_checkpointing: true
    bias_activation_fusion: false
    tensor_model_parallel_size: 4
    expert_tensor_parallel_size: 4
    expert_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    freeze_vision_model: true
    freeze_vision_projection: false
    freeze_sound_encoder: true
    freeze_sound_projection: true
    moe_router_dtype: fp32
    moe_router_load_balancing_type: none
    moe_aux_loss_coeff: 0.0
    moe_router_enable_expert_bias: true
    defer_fp32_logits: true
    radio_force_cpe_eval_mode: true
    optimizer:
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
      overlap_cpu_optimizer_d2h_h2d: false
    distributed_data_parallel_config:
      overlap_param_gather: false

checkpointing:
  enabled: false

data:
  energon:
    model_family: nemotron

logger:
  log_dir: logs/sft-nemotron-omni-30b-clevr-energon-tp4etp4
  wandb:
    project: sft-dev
    name: sft-nemotron-omni-30b-clevr-energon-tp4etp4
  tensorboard:
    log_dir: tb_logs-sft-nemotron-omni-30b-clevr-energon-tp4etp4
  swanlab:
    name: sft-nemotron-omni-30b-clevr-energon-tp4etp4
  mlflow:
    run_name: sft-nemotron-omni-30b-clevr-energon-tp4etp4

cluster:
  gpus_per_node: 8
  num_nodes: 1
