# Replay of AGA job 930860 with MTP HSM disabled and w07aju8a BF16 AdamW settings.
sft:
  max_num_epochs: 1
  max_num_steps: 1000000
  val_period: 0
  val_batches: 0
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: false
  val_at_end: false
  seed: 42
  only_unmask_final: false
  max_consecutive_step_failures: 3
checkpointing:
  enabled: true
  checkpoint_dir: "/data/nemorl-runs/sft-nemorl-nemotron-4-derisk-full-generalist-cp64-ep64-128n-20260921"
  metric_name:
  higher_is_better: false
  keep_top_k: 5
  save_period: 20
  checkpoint_must_save_by: 00:03:50:00
  save_optimizer: true
  pretrained_checkpoint:
    path: "/lustre/fsw/portfolios/nemotron/projects/nemotron_n4_post/checkpoints/nm4_nano_bridge_iter_0292000"
    format: megatron_bridge
policy:
  model_name: "/scratch/fsw/portfolios/nemotron/users/guyueh/hf_home/hub/models--mistralai--Mistral-Medium-3.5-128B/snapshots/22b2b868a15677cfa6061277ed2f653d1349a9ab"
  tokenizer:
    name: "/lustre/fsw/portfolios/nemotron/projects/nemotron_omni_vision/users/rohitkumarj/data/nemotron4/processor"
    chat_template: default
    chat_template_kwargs:
  train_global_batch_size: 32
  train_micro_batch_size: 1
  max_total_sequence_length: 524288
  precision: bfloat16
  offload_optimizer_for_logprob: false
  dtensor_cfg:
    _v2: true
    enabled: false
    env_vars: {}
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    dp_replicate_size: 1
    custom_parallel_plan:
    automodel_kwargs: {}
    lora_cfg:
      enabled: false
      target_modules: []
      exclude_modules: []
      match_all_linear: true
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: post
      lora_A_init: xavier
      use_triton: true
      restore_from:
  dynamic_batching:
    enabled: false
    train_mb_tokens: "${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}"
    sequence_length_round: 64
  sequence_packing:
    enabled: true
    train_mb_tokens: "${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}"
    algorithm: modified_first_fit_decreasing
    microbatch_order: packer
    sequence_length_round: 64
    fuse_loss: true
  make_sequence_length_divisible_by: "${policy.megatron_cfg.tensor_model_parallel_size}"
  max_grad_norm: 1.0
  optimizer:
  megatron_cfg:
    enabled: true
    checkpoint:
      async_save: false
      ckpt_assume_constant_structure: false
    use_fused_linear_logprobs: false
    fused_linear_logprobs_chunk_size: 256
    force_reconvert_from_hf: false
    env_vars:
      PYTHONPATH: "/root/.cache/huggingface/modules"
      HF_MODULES_CACHE: "/root/.cache/huggingface/modules"
      OMP_NUM_THREADS: '16'
      NCCL_NET_PLUGIN: "none"
      NVTE_FWD_LAYERNORM_SM_MARGIN: '40'
      NVTE_BWD_LAYERNORM_SM_MARGIN: '40'
      CUDA_DEVICE_MAX_CONNECTIONS: '1'
      UB_TIMEOUT: '720'
      NVTE_INF_LAYERNORM_SM_MARGIN: '40'
      NVTE_CPU_OFFLOAD_V1: '1'
      NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
      NVTE_USE_CUTLASS_GROUPED_GEMM: '0'
      NUM_OF_TOKENS_PER_CHUNK_COMBINE_API: '128'
      MIMALLOC_PURGE_DELAY: '0'
      TRITON_CACHE_DIR: "/tmp/triton_cache"
      FLA_TILELANG: '0'
    empty_unused_memory_level: 0
    activation_checkpointing: true
    cuda_graph_impl: none
    cuda_graph_modules: []
    cuda_graph_warmup_steps: 3
    fine_grained_activation_offloading: false
    offload_modules: []
    recompute_granularity: selective
    recompute_modules:
    - residual_stream
    - moe_act
    - gdp_in_proj
    - gdp_qkv
    tensor_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 64
    pipeline_model_parallel_size: 1
    context_parallel_size: 64
    pipeline_dtype: "${policy.precision}"
    num_layers_in_first_pipeline_stage:
    num_layers_in_last_pipeline_stage:
    sequence_parallel: false
    freeze_moe_router: false
    moe_router_dtype: fp32
    moe_router_load_balancing_type: quantile_balancing
    moe_router_bias_update_rate: 1e-3
    moe_permute_fusion: true
    apply_rope_fusion: false
    bias_activation_fusion: false
    defer_fp32_logits: false
    moe_per_layer_logging: false
    moe_enable_deepep: false
    moe_token_dispatcher_type: alltoall
    moe_shared_expert_overlap: false
    use_gloo_process_groups: false
    gradient_accumulation_fusion: false
    use_fused_weighted_squared_relu: true
    peft:
      enabled: false
      target_modules: []
      exclude_modules: []
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: post
      lora_A_init_method: xavier
      lora_B_init_method: zero
      a2a_experimental: false
      lora_dtype: None
      restore_from:
    optimizer:
      # Megatron's `adam` implementation applies decoupled weight decay, i.e.
      # AdamW semantics.  Keep the scalar Adam hyperparameters below as the
      # authoritative optimizer settings.
      optimizer: adam
      lr: 5.0e-06
      min_lr: 2.0e-06
      weight_decay: 0.1
      bf16: true
      fp16: false
      params_dtype: float32
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_eps: 1.0e-08
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: 1.0
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
      overlap_cpu_optimizer_d2h_h2d: false
    scheduler:
      start_weight_decay: "${policy.megatron_cfg.optimizer.weight_decay}"
      end_weight_decay: "${policy.megatron_cfg.optimizer.weight_decay}"
      weight_decay_incr_style: constant
      lr_decay_style: constant
      lr_decay_iters: 1000
      lr_warmup_iters: 10
      lr_warmup_init: 4.9999e-06
    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: false
      data_parallel_sharding_strategy: optim_grads_params
      use_custom_fsdp: false
      reduce_scatter_with_fp32_accumulation: true
      param_name_patterns_for_fp32_local_accumulation:
      - "*output_layer*"
      - "*router*"
      num_buckets: 10
      pad_buckets_for_high_nccl_busbw: true
    fp8_cfg:
      enabled: false
      fp8: e4m3
      fp8_recipe: blockwise
      fp8_param: false
    mtp_num_layers: 2
    mtp_loss_scaling_factor: 0.1
    mtp_use_repeated_layer: true
    moe_aux_loss_coeff: 0.0
    recompute_vision: true
    vision_recompute_granularity: full
    vision_recompute_method: block
    vision_recompute_num_layers: 30
    train_iters: "${sft.max_num_steps}"
    mtp_hsm: false
    moe_router_fusion: true
    moe_grouped_gemm: true
    attention_backend: flash
    high_priority_stream_groups:
    - ep
    model_overrides:
      linear_cp_mode: chunkwise
      linear_cp_layout: contiguous
      attention_cp_layout: zigzag
      gdp_cutedsl_kernel: true
      residual_stream_recompute_num_layers: 4
      use_transformer_engine_op_fuser: false
      flash_attention_version: 4
      mimo_vision_encoder_attention_backend: flash
      mimo_vision_encoder_flash_attention_version: 2
      moe_router_score_function: sigmoid
      moe_router_topk_scaling_factor: 3.16
      moe_router_quantile_balancing_estimation_scope: global_batch
      moe_router_qb_num_bins: 1000
      moe_router_skip_muon: false
      fp8:
      fp8_param: false
      fp8_quantizer_factory:
      quant_recipe:
      moe_router_padding_for_quantization: false
      moe_router_padding_for_fp8: false
      saved_args:
        mimo_vision_encoder_attention_backend: flash
        mimo_vision_encoder_flash_attention_version: 4
logger:
  log_dir: logs/sft-nemorl-nemotron-4-derisk-full-generalist-cp64-ep64-128n-20260921
  wandb_enabled: true
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: n4-sft-guyueh
    name: sft-nemorl-nemotron-4-derisk-full-generalist-cp64-ep64-128n-20260921
  swanlab:
    project: sft-dev
    name: sft-qwen2.5-vl-3b-clevr-energon-v2
  tensorboard:
    log_dir: logs/sft-nemorl-nemotron-4-derisk-full-generalist-cp64-ep64-128n-20260921
  mlflow:
    experiment_name: sft-dev
    run_name: sft-qwen2.5-vl-3b-clevr-energon-v2
    tracking_uri: http://localhost:5000
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10
cluster:
  gpus_per_node: 4
  num_nodes: 128
  segment_size:
data:
  backend: energon
  max_input_seq_length: "${policy.max_total_sequence_length}"
  add_bos: false
  add_eos: false
  add_generation_prompt: false
  shuffle: true
  num_workers: 0
  energon:
    model_family: nemotron
    num_workers: 2
    shuffle_buffer_size: 1000
    processor_adapter: hf_multimodal
    topology_mapper: default
    nvdataset_cache_dir: "/lustre/fsw/portfolios/nemotron/projects/nemotron_common_data/dss_cache"
    task_encoder:
      name: nemotron_multimodal
      packing:
        name: balanced_greedy_knapsack
        buffer_size: 1000
        options:
          max_sequence_length: "${policy.max_total_sequence_length}"
          sequence_length_pad_multiple: 128
          balanced_knapsack_delta: 5
      options:
        patch_dim: 14
        prompt_format: nemotron6-moe
        thinking_trace_format: ultra
        temporal_patch_size: 1
        allow_large_videos: true
        video_max_num_frames: 64
        video_aug_scale_frames_up: 4
        video_aug_scale_resolution_only: true
    cookers:
    - name: nemotron_conversation
      has_subflavors:
        cook: conversation
    - name: nemotron_general_conversations_jsonl
      has_subflavors:
        cook: general_conversations_jsonl
    - name: nemotron_general_conversations_webdataset
      has_subflavors:
        cook: general_conversations_webdataset
    - name: nemotron_nano_openai_messages_jsonl
      has_subflavors:
        cook: openai_messages_jsonl
    watchdog_timeout_seconds: 1200
    prefetch_factor: 2
    cache_pool_num_workers: 2
    gc_collect_every_n_steps: 100000
    seed_offset: 0
  train:
    path: "/lustre/fsw/portfolios/nemotron/users/guyueh/sft_data/super3dot5/energon_recipe_cmh.yaml"
    split: train
    virtual_epoch_length: 10000000
  validation:
data_plane:
  enabled: true
  impl: local
  max_partitions: 2
